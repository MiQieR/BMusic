name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: .build/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'BMusic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build macOS app
        run: ./Scripts/build-app.sh release

      - name: Pack DMG (with Applications shortcut)
        run: |
          STAGING="$(mktemp -d)"
          cp -R build/BMusic.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "BMusic" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "build/BMusic.dmg"

      - name: Build unsigned iOS IPA
        run: ./Scripts/build-ios.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/BMusic.dmg dist/
          cp build/BMusic-unsigned.ipa dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: BMusic-installers
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BMusic-installers
          path: dist

      # 推送 v* 标签 → 稳定版 Release。
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 推送 main → 刷新滚动发布的 latest 预发布。
      - name: Refresh rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --prerelease \
            --notes "main 分支自动构建（${GITHUB_SHA::7}）。DMG 拖入 Applications 安装；IPA 未签名，供 LiveContainer 或自签使用。"
