name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: .build/spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'BMusic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build macOS app
        run: ./Scripts/build-app.sh release

      - name: Pack DMG (with Applications shortcut)
        run: |
          STAGING="$(mktemp -d)"
          cp -R build/BMusic.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "BMusic" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "build/BMusic.dmg"

      - name: Build unsigned iOS IPA
        run: ./Scripts/build-ios.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/BMusic.dmg dist/
          cp build/BMusic-unsigned.ipa dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: BMusic-installers
          path: dist/
          if-no-files-found: error

  release:
    # 推送 v* 标签时，把安装包发布到 GitHub Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BMusic-installers
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
