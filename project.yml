name: BMusic
options:
  bundleIdPrefix: app.bmusic
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  groupSortPosition: top
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  BMusic-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/BMusic
      - path: Resources/BMusic.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BMusic
        PRODUCT_BUNDLE_IDENTIFIER: app.bmusic.desktop
        INFOPLIST_FILE: Resources/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MPVKit
        product: MPVKit
  BMusic-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/BMusic/IOS
      - path: Sources/BMusic/Features/Login
      - path: Sources/BMusic/Core
      - path: Sources/BMusic/Playback
      - path: Sources/BMusic/DesignSystem/Theme.swift
      - path: Sources/BMusic/DesignSystem/Components.swift
      - path: Sources/BMusic/App/AppState.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BMusic
        PRODUCT_BUNDLE_IDENTIFIER: app.bmusic.ios
        INFOPLIST_FILE: Resources/Info-iOS.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: MPVKit
        product: MPVKit
schemes:
  BMusic-iOS:
    build:
      targets:
        BMusic-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  BMusic-macOS:
    build:
      targets:
        BMusic-macOS: all
    run:
      config: Debug
    archive:
      config: Release
